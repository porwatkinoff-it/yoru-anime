plugins { id 'com.android.application' }
// Ключи OAuth-приложения Шикимори: ../shikimori.local.json (в git не попадает), без файла — пустые
def shikiKeys = { def f = new File(rootProject.projectDir.parentFile, 'shikimori.local.json'); f.exists() ? new groovy.json.JsonSlurper().parse(f) : [:] }()
def q = { v -> '"' + (v ?: '').toString().replace('\\','\\\\').replace('"','\\"') + '"' }
android {
 namespace 'com.resvvt.nightanime'
 compileSdk 35
 defaultConfig { applicationId 'com.resvvt.nightanime'; minSdk 28; targetSdk 35; versionCode 34; versionName '2.3.3'; ndk { abiFilters 'armeabi-v7a','arm64-v8a' }
  buildConfigField 'String', 'SHIKI_ID', q(shikiKeys.client_id); buildConfigField 'String', 'SHIKI_SECRET', q(shikiKeys.client_secret) }
 buildFeatures { buildConfig true }
 signingConfigs { personal { storeFile System.getenv('KEYSTORE_PATH') ? file(System.getenv('KEYSTORE_PATH')) : null; storePassword System.getenv('KEYSTORE_PASSWORD'); keyAlias System.getenv('KEY_ALIAS') ?: 'nighttv'; keyPassword System.getenv('KEY_PASSWORD') } }
 buildTypes { release { signingConfig signingConfigs.personal; minifyEnabled false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'org.videolan.android:libvlc-all:3.6.5' }
