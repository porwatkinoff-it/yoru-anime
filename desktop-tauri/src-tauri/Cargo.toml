[package]
name = "yoru-anime"
version = "2.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "http2"] }
url = "2"
tokio = { version = "1", features = ["time", "sync", "macros"] }
encoding_rs = "0.8"
percent-encoding = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Power", "Win32_Storage_FileSystem"] }
aes-gcm = "0.10"
base64 = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
