<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data: blob: mimg: http://mimg.localhost; media-src https: blob: yoru: http://yoru.localhost; connect-src 'self' https:; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data: blob:">
<title>Yoru</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="drag"></div>
    <div class="brand"><span class="moon"></span>Yoru</div>
    <div class="modes" id="modes"><button data-mode="anime" class="on">Аниме</button><button data-mode="manga">Манга</button></div>
    <nav id="nav" data-mode="anime">
      <button data-tab="home" data-group="anime" class="active"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Главная</span></button>
      <button data-tab="search" data-group="anime"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Поиск</span></button>
      <button data-tab="mine" data-group="anime"><svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"/></svg><span>Моё</span></button>
      <button data-tab="schedule" data-group="anime"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Расписание</span></button>
      <button data-tab="downloads" data-group="anime" id="nav-downloads" hidden><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></svg><span>Загрузки</span><i class="count" hidden></i></button>
      <button data-tab="manga" data-group="manga"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5zM4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></svg><span>Каталог</span></button>
      <button data-tab="mangaMine" data-group="manga"><svg viewBox="0 0 24 24"><path d="M6 3.5h12v17l-6-4-6 4z"/></svg><span>Моя манга</span></button>
    </nav>
    <div class="grow"></div>
    <div id="downloads"></div>
    <button id="update-chip" hidden></button>
    <button id="account-button" data-tab="account"><span class="avatar"></span><span class="who">Аккаунты</span></button>
  </aside>
  <main id="main"></main>
</div>
<div id="modal-root"></div>
<div id="toast"></div>
<script type="module" src="vendor/jassub.js"></script>
<script type="module" src="subtitle-smoke.js"></script>
</body>
</html>
